<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Học tiếng Anh mỗi ngày</title>
<meta name="theme-color" content="#3b5bdb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nen:#f4f6fb; --the:#ffffff; --chu:#1d2433; --phu:#667085; --vien:#e3e7ef;
  --chinh:#3b5bdb; --chinh-nhat:#e8edff; --dung:#12925a; --dung-nhat:#e3f6ec;
  --sai:#d6453d; --sai-nhat:#fdeceb; --vang:#b7791f; --vang-nhat:#fdf3e1;
  --bo:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--nen);color:var(--chu);font:16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.khung{max-width:560px;margin:0 auto;padding:0 16px 96px}
.dau{position:sticky;top:0;z-index:5;background:var(--nen);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
.dau h1{font-size:18px;margin:0;flex:1;line-height:1.3}
.dau .nho{font-size:13px;color:var(--phu);font-weight:400;display:block}
.nut-tron{width:40px;height:40px;border-radius:50%;border:1px solid var(--vien);background:var(--the);display:grid;place-items:center;cursor:pointer;flex:none;font-size:18px}
.the{background:var(--the);border:1px solid var(--vien);border-radius:var(--bo);padding:16px;margin:0 0 12px}
.nut{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--vien);background:var(--the);cursor:pointer;font-weight:600}
.nut.chinh{background:var(--chinh);border-color:var(--chinh);color:#fff}
.nut.rong{width:100%}
.nut:disabled{opacity:.45;cursor:default}
.nut.nho{min-height:38px;padding:6px 12px;font-size:14px}
.hang{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hang>.gian{flex:1}
input[type=text],input[type=tel]{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--vien);border-radius:12px;background:#fff;font-size:17px}
input:focus{outline:2px solid var(--chinh);outline-offset:1px}
label.nhan{display:block;font-weight:600;margin:12px 0 6px}
.mo{color:var(--phu);font-size:14px}
.tab-gd{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.tab-gd button{flex:none;border:1px solid var(--vien);background:var(--the);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.tab-gd button.chon{background:var(--chinh);color:#fff;border-color:var(--chinh)}
.buoi{cursor:pointer;display:block;width:100%;text-align:left}
.buoi .so{font-size:13px;color:var(--chinh);font-weight:600}
.buoi .ten{font-weight:600;margin:2px 0 4px}
.buoi .np{font-size:13px;color:var(--phu)}
.cham{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cham span{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--nen);color:var(--phu)}
.cham span.xong{background:var(--dung-nhat);color:var(--dung)}
.tab-phan{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--the);border:1px solid var(--vien);border-radius:12px;padding:4px;margin-bottom:14px}
.tab-phan button{border:0;background:none;padding:9px 2px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--phu)}
.tab-phan button.chon{background:var(--chinh-nhat);color:var(--chinh)}
.the-tu{text-align:center;padding:28px 16px}
.the-tu .en{font-size:30px;font-weight:700;margin:0}
.ipa{color:var(--phu);font-size:16px}
.the-tu .vi{font-size:20px;font-weight:600;color:var(--chinh);margin-top:14px}
.vd{margin-top:12px;padding:12px;border-radius:12px;background:var(--nen);text-align:left}
.tien-do{height:6px;background:var(--vien);border-radius:6px;overflow:hidden;margin:4px 0 14px}
.tien-do i{display:block;height:100%;background:var(--chinh);transition:width .3s}
.cau-hoi{font-size:19px;font-weight:600;margin:4px 0 14px;white-space:pre-line}
.lua-chon{display:grid;gap:8px}
.lua-chon button{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--vien);background:#fff;cursor:pointer;font-size:16px}
.lua-chon button.dung{background:var(--dung-nhat);border-color:var(--dung);color:var(--dung);font-weight:600}
.lua-chon button.sai{background:var(--sai-nhat);border-color:var(--sai);color:var(--sai)}
.phan-hoi{margin-top:14px;padding:12px 14px;border-radius:12px}
.phan-hoi.dung{background:var(--dung-nhat)}
.phan-hoi.sai{background:var(--sai-nhat)}
.phan-hoi b{display:block}
.o-chu{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:2px dashed var(--vien);border-radius:12px;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:10px;border:1px solid var(--vien);background:#fff;cursor:pointer;font-size:16px}
.chip.da-dung{visibility:hidden}
.muc-noi .en{font-size:19px;font-weight:600}
.muc-noi .an{filter:blur(6px);user-select:none}
.ket-qua-noi{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--nen);font-size:15px}
.w-dung{color:var(--dung);font-weight:600}
.w-sai{color:var(--sai);text-decoration:underline wavy;text-underline-offset:4px}
.diem{display:inline-block;font-weight:700;padding:2px 10px;border-radius:999px;font-size:14px}
.diem.tot{background:var(--dung-nhat);color:var(--dung)}
.diem.kha{background:var(--vang-nhat);color:var(--vang)}
.diem.yeu{background:var(--sai-nhat);color:var(--sai)}
.nut-mic{background:var(--sai);border-color:var(--sai);color:#fff}
.nut-mic.dang-nghe{animation:nhap 1s infinite}
@keyframes nhap{50%{opacity:.6}}
.chuyen{display:flex;gap:6px;margin-bottom:12px}
.chuyen button{flex:1;border:1px solid var(--vien);background:var(--the);border-radius:10px;padding:8px;cursor:pointer;font-size:14px;font-weight:600}
.chuyen button.chon{background:var(--chu);color:#fff;border-color:var(--chu)}
.thong-bao{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--chu);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.thong-bao.hien{opacity:1}
.lon{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.giua{text-align:center}
ul.sai-list{padding-left:18px;margin:8px 0}
ul.sai-list li{margin-bottom:8px}
.canh-bao{background:var(--vang-nhat);color:#7a4f10;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<div class="khung" id="app"></div>
<div class="thong-bao" id="thong-bao"></div>
<script src="cau-hinh.js"></script>
<script src="noi-dung.js"></script>
<script>
(function(){
'use strict';
var GD_TEN = {1:'0 → A1',2:'A1 → A2',3:'A2 → A2+',4:'A2+ → B1',5:'B1 → B1+'};
var PHAN = [
  {ma:'tu', ten:'Từ vựng'},
  {ma:'bai', ten:'Bài tập'},
  {ma:'noi', ten:'Nói theo'},
  {ma:'nghe', ten:'Nghe chép'}
];
var API = (window.API_URL || '').trim();
var $app = document.getElementById('app');

/* ---------- lưu trên máy ---------- */
function doc(k, macDinh){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : macDinh; }catch(e){ return macDinh; } }
function ghi(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var nguoiHoc = doc('nguoiHoc', null);
var tienDo = doc('tienDo', {});      // "gd-buoi-phan" -> % cao nhất
var dsBuoi = (window.NOI_DUNG || []).slice();
var st = { man:'chu', gd: doc('gdDangHoc', 1), buoi:null, phan:'tu' };

/* ---------- tiện ích ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function tron(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function bao(chu){ var b=document.getElementById('thong-bao'); b.textContent=chu; b.classList.add('hien'); clearTimeout(bao._t); bao._t=setTimeout(function(){ b.classList.remove('hien'); }, 2600); }
function muc(p){ return p>=85 ? 'tot' : (p>=60 ? 'kha' : 'yeu'); }
function khoa(b, phan){ return b.gd + '-' + b.buoi + '-' + phan; }
function chuanHoa(s){ return String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?]+$/,''); }

/* ---------- đọc to (giọng có sẵn trên máy) ---------- */
var giong = null;
function chonGiong(){
  if(!('speechSynthesis' in window)) return;
  var ds = speechSynthesis.getVoices().filter(function(v){ return /^en[-_]/i.test(v.lang); });
  var uuTien = ds.filter(function(v){ return /en[-_]US/i.test(v.lang) && /Google|Samantha|Aria|Jenny|Microsoft/i.test(v.name); });
  giong = uuTien[0] || ds.filter(function(v){ return /en[-_](US|GB)/i.test(v.lang); })[0] || ds[0] || null;
}
if('speechSynthesis' in window){ chonGiong(); speechSynthesis.onvoiceschanged = chonGiong; }
function docTo(text, cham){
  if(!('speechSynthesis' in window)){ bao('Máy này không đọc được tiếng. Hãy mở bằng Chrome hoặc Safari.'); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = giong ? giong.lang : 'en-US';
  if(giong) u.voice = giong;
  u.rate = cham ? 0.6 : 0.9;
  speechSynthesis.speak(u);
}

/* ---------- nghe giọng người học ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var dangNghe = null;
function ngheNguoiHoc(xong, loi){
  if(!SR){ loi('khong-ho-tro'); return; }
  if(dangNghe){ try{ dangNghe.abort(); }catch(e){} }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  var r = new SR();
  r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
  var cac = [], daXong = false;
  r.onresult = function(e){
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(!e.results[i].isFinal) continue;
      for(var j=0;j<e.results[i].length;j++) cac.push(e.results[i][j].transcript);
    }
  };
  r.onerror = function(e){ daXong = true; dangNghe = null; loi(e.error); };
  r.onend = function(){ dangNghe = null; if(daXong) return; daXong = true; if(cac.length) xong(cac); else loi('no-speech'); };
  dangNghe = r;
  try{ r.start(); }catch(e){ dangNghe = null; loi('khong-bat-dau'); }
}
function loiMic(ma){
  if(ma === 'khong-ho-tro') return 'Trình duyệt này chưa chấm được giọng nói. Trên Android hãy mở bằng Chrome, trên iPhone hãy mở bằng Safari.';
  if(ma === 'not-allowed' || ma === 'service-not-allowed') return 'Chưa được phép dùng micro. Bấm vào biểu tượng ổ khoá cạnh địa chỉ trang, cho phép Micro rồi thử lại.';
  if(ma === 'no-speech') return 'Chưa nghe thấy gì. Bấm nút rồi nói to, rõ hơn một chút nhé.';
  if(ma === 'network') return 'Mạng yếu nên chưa chấm được. Thử lại sau vài giây.';
  if(ma === 'aborted') return '';
  return 'Chưa nghe rõ, thử lại nhé.';
}

/* ---------- so khớp từng từ ---------- */
var VIET_TAT = {"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","there's":"there is","what's":"what is","where's":"where is","who's":"who is","how's":"how is","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","we'll":"we will","they'll":"they will","it'll":"it will","i'd":"i would","you'd":"you would","he'd":"he would","she'd":"she would","we'd":"we would","they'd":"they would","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","haven't":"have not","hasn't":"has not","hadn't":"had not","shouldn't":"should not","wouldn't":"would not","couldn't":"could not","mustn't":"must not","let's":"let us"};
var SO = {'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve'};
function tachTu(chu){
  return chuanHoa(chu).replace(/[^a-z0-9' -]/g,' ').replace(/-/g,' ').split(' ').filter(Boolean).map(function(w){
    w = w.replace(/^'+|'+$/g,'');
    if(VIET_TAT[w]) return VIET_TAT[w].split(' ');
    if(SO[w]) return [SO[w]];
    if(/'s$/.test(w)) return [w.slice(0,-2)];
    if(w === 'ok' || w === 'okay') return ['okay'];
    return [w];
  });
}
function soKhop(mau, noi){
  var nhom = tachTu(mau), dich = [], chu = [];
  nhom.forEach(function(g, i){ g.forEach(function(t){ dich.push(t); chu.push(i); }); });
  var n0 = [].concat.apply([], tachTu(noi)), n = [];
  for(var x=0;x<n0.length;x++){
    if(x+1<n0.length && dich.indexOf(n0[x])<0 && dich.indexOf(n0[x]+n0[x+1])>=0){ n.push(n0[x]+n0[x+1]); x++; }
    else n.push(n0[x]);
  }
  var A = dich.length, B = n.length, L = [];
  for(var i=0;i<=A;i++){ L.push(new Array(B+1).fill(0)); }
  for(i=A-1;i>=0;i--) for(var j=B-1;j>=0;j--) L[i][j] = dich[i]===n[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  var khop = new Array(A).fill(false); i=0; j=0;
  while(i<A && j<B){ if(dich[i]===n[j]){ khop[i]=true; i++; j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  var tu = mau.trim().split(/\s+/);
  var tuOk = new Array(nhom.length).fill(true);
  khop.forEach(function(k, t){ if(!k) tuOk[chu[t]] = false; });
  var soDung = khop.filter(Boolean).length;
  var thua = Math.max(0, B - soDung);
  var p = A ? Math.round(100 * soDung / (A + thua*0.5)) : 0;
  return { phanTram: Math.min(100,p), tu: tu, dung: tu.map(function(_, i){ return tuOk[i] !== undefined ? tuOk[i] : true; }) };
}
function chamNoi(mau, cac){
  var tot = null, nghe = '';
  cac.forEach(function(c){ var k = soKhop(mau, c); if(!tot || k.phanTram > tot.phanTram){ tot = k; nghe = c; } });
  tot.nghe = nghe; return tot;
}
function veKhop(k){
  return k.tu.map(function(w, i){ return '<span class="' + (k.dung[i] ? 'w-dung' : 'w-sai') + '">' + esc(w) + '</span>'; }).join(' ');
}

/* ---------- nối Google Sheet ---------- */
function guiKetQua(b, phan, diem, tong, chiTiet){
  var pt = tong ? Math.round(100*diem/tong) : 0;
  var k = khoa(b, phan);
  if(!(k in tienDo) || pt > tienDo[k]){ tienDo[k] = pt; ghi('tienDo', tienDo); }
  if(!API) return;
  var tenPhan = PHAN.filter(function(p){ return p.ma===phan; })[0].ten;
  var goi = { ten: nguoiHoc.ten, sdt: nguoiHoc.sdt, gd: b.gd, buoi: b.buoi, ten_buoi: b.ten, phan: tenPhan,
              diem: diem, tong: tong, phan_tram: pt, chi_tiet: (chiTiet||'').slice(0,1500), luc: new Date().toISOString() };
  var hang = doc('hangCho', []); hang.push(goi); ghi('hangCho', hang); guiHangCho();
}
var dangGui = false;
function guiHangCho(){
  if(!API || dangGui) return;
  var hang = doc('hangCho', []); if(!hang.length) return;
  dangGui = true;
  fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ a:'ghi', ds: hang }) })
    .then(function(r){ return r.json(); })
    .then(function(kq){ if(kq && kq.ok){ var con = doc('hangCho', []).slice(hang.length); ghi('hangCho', con); } })
    .catch(function(){})
    .then(function(){ dangGui = false; });
}
function taiNoiDungSheet(){
  var luu = doc('noiDungSheet', null);
  if(luu) gopSheet(luu);
  if(!API) return;
  fetch(API + '?a=noidung').then(function(r){ return r.json(); }).then(function(kq){
    if(kq && kq.dong && kq.dong.length){ ghi('noiDungSheet', kq.dong); gopSheet(kq.dong); veLai(); }
  }).catch(function(){});
}
function gopSheet(dong){
  var goc = {}; (window.NOI_DUNG||[]).forEach(function(b){ goc[b.gd+'-'+b.buoi] = b; });
  var moi = {};
  dong.forEach(function(r){
    var gd = parseInt(r[0],10), bu = parseInt(r[1],10), loai = String(r[2]||'').trim();
    if(!gd || !bu || !loai) return;
    var k = gd+'-'+bu, g = goc[k] || {};
    if(!moi[k]) moi[k] = { gd:gd, buoi:bu, ten:g.ten||('Buổi '+bu), ngu_phap:g.ngu_phap||'', chu_de:g.chu_de||'', phat_am:g.phat_am||'', tu:[], luyen_am:[], cau:[], bai:[] };
    var m = moi[k], en = String(r[3]||'').trim(), tach = function(s){ return String(s||'').split('|').map(function(x){ return x.trim(); }).filter(Boolean); };
    if(!en) return;
    if(loai === 'Tên buổi') m.ten = en;
    else if(loai === 'Từ vựng') m.tu.push({ en:en, ipa:r[4], vi:r[5], vd:r[9], vd_vi:r[10] });
    else if(loai === 'Luyện âm') m.luyen_am.push({ en:en, ipa:r[4], ghi_chu:r[8] });
    else if(loai === 'Câu nói') m.cau.push({ en:en, vi:r[5] });
    else if(loai === 'Trắc nghiệm'){ var da = tach(r[6]); if(da.length) m.bai.push({ dang:'chon', hoi:en, dap_an:da[0], sai:tach(r[7]), giai_thich:r[8] }); }
    else if(loai === 'Điền từ'){ var d2 = tach(r[6]); if(d2.length) m.bai.push({ dang:'dien', hoi:en, dap_an:d2[0], chap_nhan:d2, giai_thich:r[8] }); }
    else if(loai === 'Sắp xếp câu') m.bai.push({ dang:'sapxep', dap_an:en, vi:r[5], giai_thich:r[8] });
  });
  var tat = Object.assign({}, goc, moi);
  dsBuoi = Object.keys(tat).map(function(k){ return tat[k]; }).sort(function(a,b){ return a.gd-b.gd || a.buoi-b.buoi; });
}

/* ---------- màn đăng nhập ---------- */
function veDangNhap(){
  $app.innerHTML =
    '<div style="padding-top:48px"><h1 style="font-size:26px;margin:0 0 6px">Học tiếng Anh mỗi ngày 👋</h1>' +
    '<p class="mo" style="margin:0 0 18px">Luyện từ vựng, làm bài tập và luyện nói theo từng buổi học. Nhập tên một lần, lần sau vào học luôn.</p>' +
    '<div class="the"><label class="nhan" for="ten">Họ và tên</label><input type="text" id="ten" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn An">' +
    '<label class="nhan" for="sdt">Số điện thoại</label><input type="tel" id="sdt" autocomplete="tel" placeholder="Để giáo viên biết bài của bạn">' +
    '<div style="height:16px"></div><button class="nut chinh rong" id="vao">Bắt đầu học</button></div></div>';
  var vao = function(){
    var ten = document.getElementById('ten').value.trim(), sdt = document.getElementById('sdt').value.replace(/\s/g,'');
    if(ten.length < 2){ bao('Bạn nhập họ tên giúp mình nhé'); return; }
    if(!/^\+?\d{8,13}$/.test(sdt)){ bao('Số điện thoại chưa đúng'); return; }
    nguoiHoc = { ten:ten, sdt:sdt }; ghi('nguoiHoc', nguoiHoc); st.man='chu'; veLai();
  };
  document.getElementById('vao').onclick = vao;
  document.getElementById('sdt').onkeydown = function(e){ if(e.key==='Enter') vao(); };
}

/* ---------- trang chủ ---------- */
function veTrangChu(){
  var gds = []; dsBuoi.forEach(function(b){ if(gds.indexOf(b.gd)<0) gds.push(b.gd); });
  if(gds.indexOf(st.gd)<0) st.gd = gds[0];
  var h = '<div class="dau"><h1>Chào ' + esc(nguoiHoc.ten.split(' ').pop()) + '!<span class="nho">Hôm nay mình học buổi nào?</span></h1>' +
          '<button class="nut-tron" id="doi" title="Đổi người học" aria-label="Đổi người học">👤</button></div>';
  h += '<div class="tab-gd">' + gds.map(function(g){ return '<button data-gd="'+g+'" class="'+(g===st.gd?'chon':'')+'">Giai đoạn '+g+' · '+(GD_TEN[g]||'')+'</button>'; }).join('') + '</div>';
  dsBuoi.filter(function(b){ return b.gd===st.gd; }).forEach(function(b){
    var co = b.tu.length || b.bai.length || b.cau.length;
    h += '<button class="the buoi" data-k="'+b.gd+'-'+b.buoi+'"'+(co?'':' disabled')+'><div class="so">Buổi '+b.buoi+'</div><div class="ten">'+esc(b.ten)+'</div>' +
         '<div class="np">'+esc(b.chu_de)+(b.phat_am?' · Phát âm: '+esc(b.phat_am):'')+'</div>';
    if(co){
      h += '<div class="cham">' + PHAN.map(function(p){ var v = tienDo[khoa(b,p.ma)]; return '<span class="'+(v!=null?'xong':'')+'">'+p.ten+(v!=null?' '+v+'%':'')+'</span>'; }).join('') + '</div>';
    } else h += '<div class="cham"><span>Đang soạn nội dung</span></div>';
    h += '</button>';
  });
  $app.innerHTML = h;
  $app.querySelectorAll('.tab-gd button').forEach(function(x){ x.onclick = function(){ st.gd = +x.dataset.gd; ghi('gdDangHoc', st.gd); veLai(); }; });
  $app.querySelectorAll('.buoi').forEach(function(x){ x.onclick = function(){
    var k = x.dataset.k; st.buoi = dsBuoi.filter(function(b){ return b.gd+'-'+b.buoi===k; })[0]; st.man='buoi'; st.phan='tu'; batDauPhan(); veLai(); window.scrollTo(0,0);
  }; });
  document.getElementById('doi').onclick = function(){
    if(confirm('Đổi sang người học khác? Tiến độ trên máy này vẫn được giữ.')){ nguoiHoc = null; ghi('nguoiHoc', null); veLai(); }
  };
}

/* ---------- màn buổi học ---------- */
var p = {}; // trạng thái của phần đang làm
function batDauPhan(){
  var b = st.buoi;
  if(st.phan === 'tu') p = { che:'the', i:0, lat:false };
  if(st.phan === 'bai') p = { ds: b.bai.map(function(x){ return Object.assign({}, x, { lc: x.dang==='chon' ? tron([x.dap_an].concat(x.sai||[])) : null }); }), i:0, da:null, dung:0, sai:[], xep:[], chon:null };
  if(st.phan === 'noi') p = { an:false, ket:{} };
  if(st.phan === 'nghe') p = { i:0, ds: tron(b.cau).slice(0, Math.min(6, b.cau.length)), da:null, diem:0, ket:[] };
  if(st.phan === 'kt') p = taoKiemTraTu(b);
}
function veBuoi(){
  var b = st.buoi;
  var h = '<div class="dau"><button class="nut-tron" id="ve" aria-label="Quay lại">←</button><h1>'+esc(b.ten)+'<span class="nho">Giai đoạn '+b.gd+' · Buổi '+b.buoi+' · '+esc(b.chu_de)+'</span></h1></div>';
  var phanHien = st.phan === 'kt' ? 'tu' : st.phan;
  h += '<div class="tab-phan">' + PHAN.map(function(x){ return '<button data-p="'+x.ma+'" class="'+(x.ma===phanHien?'chon':'')+'">'+x.ten+'</button>'; }).join('') + '</div>';
  h += '<div id="noi-dung"></div>';
  $app.innerHTML = h;
  document.getElementById('ve').onclick = function(){ if('speechSynthesis' in window) speechSynthesis.cancel(); st.man='chu'; veLai(); };
  $app.querySelectorAll('.tab-phan button').forEach(function(x){ x.onclick = function(){ st.phan = x.dataset.p; batDauPhan(); veLai(); }; });
  var vung = document.getElementById('noi-dung');
  ({ tu: veTheTu, kt: veKiemTraTu, bai: veBaiTap, noi: veNoiTheo, nghe: veNgheChep })[st.phan](vung, b);
}

/* --- Từ vựng: thẻ --- */
function veTheTu(v, b){
  var ds = b.tu; if(!ds.length){ v.innerHTML = '<p class="mo">Buổi này chưa có từ vựng.</p>'; return; }
  var t = ds[p.i];
  var h = '<div class="hang mo"><span class="gian">Thẻ '+(p.i+1)+'/'+ds.length+'</span><span>Bấm vào thẻ để xem nghĩa</span></div>' +
    '<div class="tien-do"><i style="width:'+Math.round(100*(p.i+1)/ds.length)+'%"></i></div>' +
    '<div class="the the-tu" id="the" style="cursor:pointer"><p class="en">'+esc(t.en)+'</p><div class="ipa">'+esc(t.ipa||'')+'</div>';
  if(p.lat){
    h += '<div class="vi">'+esc(t.vi||'')+'</div>';
    if(t.vd) h += '<div class="vd"><div>'+esc(t.vd)+' <button class="nut nho" data-doc="vd">🔊</button></div><div class="mo">'+esc(t.vd_vi||'')+'</div></div>';
  }
  h += '</div><div class="hang" style="justify-content:center;margin-bottom:12px"><button class="nut" data-doc="tu">🔊 Nghe</button><button class="nut" data-doc="cham">🐢 Chậm</button><button class="nut nut-mic" id="mic">🎤 Nói thử</button></div>' +
       '<div id="kq-mic"></div>' +
       '<div class="hang"><button class="nut gian" id="truoc"'+(p.i===0?' disabled':'')+'>← Trước</button>' +
       (p.i < ds.length-1 ? '<button class="nut chinh gian" id="tiep">Tiếp →</button>' : '<button class="nut chinh gian" id="kt">Kiểm tra từ vựng</button>') + '</div>';
  v.innerHTML = h;
  document.getElementById('the').onclick = function(e){ if(e.target.closest('button')) return; p.lat = !p.lat; veLai(); };
  v.querySelectorAll('[data-doc]').forEach(function(x){ x.onclick = function(){ var k = x.dataset.doc; docTo(k==='vd' ? t.vd : t.en, k==='cham'); }; });
  document.getElementById('truoc').onclick = function(){ p.i--; p.lat=false; veLai(); docTo(ds[p.i].en); };
  var tiep = document.getElementById('tiep'); if(tiep) tiep.onclick = function(){ p.i++; p.lat=false; veLai(); docTo(ds[p.i].en); };
  var kt = document.getElementById('kt'); if(kt) kt.onclick = function(){ st.phan='kt'; batDauPhan(); veLai(); };
  ganMic(document.getElementById('mic'), t.en, document.getElementById('kq-mic'));
}
function ganMic(nut, mau, oKq, khiCham){
  nut.onclick = function(){
    if(dangNghe){ try{ dangNghe.stop(); }catch(e){} return; }
    nut.classList.add('dang-nghe'); nut.textContent = '🎤 Đang nghe...';
    oKq.innerHTML = '<div class="ket-qua-noi mo">Nói ngay bây giờ: “'+esc(mau)+'”</div>';
    ngheNguoiHoc(function(cac){
      nut.classList.remove('dang-nghe'); nut.textContent = '🎤 Nói lại';
      var k = chamNoi(mau, cac);
      oKq.innerHTML = '<div class="ket-qua-noi"><div><span class="diem '+muc(k.phanTram)+'">'+k.phanTram+'%</span> '+(k.phanTram>=85?'Rất tốt!':k.phanTram>=60?'Khá rồi, chú ý chữ màu đỏ.':'Nghe mẫu rồi thử lại nhé.')+'</div>' +
        '<div style="margin-top:6px">'+veKhop(k)+'</div><div class="mo" style="margin-top:4px">Máy nghe được: “'+esc(k.nghe)+'”</div></div>';
      if(khiCham) khiCham(k);
    }, function(ma){
      nut.classList.remove('dang-nghe'); nut.textContent = '🎤 Nói thử';
      var m = loiMic(ma); oKq.innerHTML = m ? '<div class="canh-bao">'+esc(m)+'</div>' : '';
    });
  };
}

/* --- Từ vựng: kiểm tra --- */
function taoKiemTraTu(b){
  var ds = tron(b.tu);
  return { i:0, dung:0, da:null, sai:[], ds: ds.map(function(t, n){
    var khac = tron(b.tu.filter(function(x){ return x !== t; })).slice(0,3);
    var nghe = n % 2 === 1;
    return nghe ? { kieu:'nghe', t:t, dap:t.vi, lc: tron([t.vi].concat(khac.map(function(x){ return x.vi; }))) }
                : { kieu:'nghia', t:t, dap:t.en, lc: tron([t.en].concat(khac.map(function(x){ return x.en; }))) };
  }) };
}
function veKiemTraTu(v, b){
  if(p.i >= p.ds.length) return veTongKet(v, b, 'tu', p.dung, p.ds.length, p.sai, function(){ st.phan='kt'; batDauPhan(); veLai(); });
  var q = p.ds[p.i];
  var h = '<div class="hang mo"><span class="gian">Kiểm tra từ vựng · Câu '+(p.i+1)+'/'+p.ds.length+'</span><button class="nut nho" id="ve-the">Xem lại thẻ</button></div>' +
          '<div class="tien-do"><i style="width:'+Math.round(100*p.i/p.ds.length)+'%"></i></div><div class="the">';
  if(q.kieu==='nghe') h += '<div class="cau-hoi">Nghe và chọn nghĩa đúng</div><div class="hang" style="margin-bottom:14px"><button class="nut" id="nghe-lai">🔊 Nghe</button><button class="nut" id="nghe-cham">🐢 Chậm</button></div>';
  else h += '<div class="cau-hoi">Từ nào nghĩa là “'+esc(q.t.vi)+'”?</div>';
  h += '<div class="lua-chon">' + q.lc.map(function(x){
    var c = ''; if(p.da!=null){ if(x===q.dap) c='dung'; else if(x===p.da) c='sai'; }
    return '<button class="'+c+'" data-x="'+esc(x)+'"'+(p.da!=null?' disabled':'')+'>'+esc(x)+'</button>'; }).join('') + '</div>';
  if(p.da!=null){
    var ok = p.da===q.dap;
    h += '<div class="phan-hoi '+(ok?'dung':'sai')+'"><b>'+(ok?'Đúng rồi!':'Chưa đúng')+'</b>'+esc(q.t.en)+' '+esc(q.t.ipa||'')+' = '+esc(q.t.vi)+'</div>' +
         '<div style="height:12px"></div><button class="nut chinh rong" id="tiep">Câu tiếp</button>';
  }
  h += '</div>'; v.innerHTML = h;
  document.getElementById('ve-the').onclick = function(){ st.phan='tu'; batDauPhan(); veLai(); };
  if(q.kieu==='nghe'){ document.getElementById('nghe-lai').onclick = function(){ docTo(q.t.en); }; document.getElementById('nghe-cham').onclick = function(){ docTo(q.t.en, true); }; if(p.da==null && !p.daDoc){ p.daDoc = true; setTimeout(function(){ docTo(q.t.en); }, 250); } }
  v.querySelectorAll('.lua-chon button').forEach(function(x){ x.onclick = function(){
    p.da = x.dataset.x; if(p.da===q.dap) p.dung++; else p.sai.push(q.t.en+' = '+q.t.vi); docTo(q.t.en); veLai(); }; });
  var tiep = document.getElementById('tiep'); if(tiep) tiep.onclick = function(){ p.i++; p.da=null; p.daDoc=false; veLai(); };
}

/* --- Bài tập --- */
function veBaiTap(v, b){
  if(!p.ds.length){ v.innerHTML = '<p class="mo">Buổi này chưa có bài tập.</p>'; return; }
  if(p.i >= p.ds.length) return veTongKet(v, b, 'bai', p.dung, p.ds.length, p.sai, function(){ batDauPhan(); veLai(); });
  var q = p.ds[p.i], daLam = p.da!=null;
  var h = '<div class="hang mo"><span class="gian">Câu '+(p.i+1)+'/'+p.ds.length+'</span><span>Đúng '+p.dung+'</span></div>' +
          '<div class="tien-do"><i style="width:'+Math.round(100*p.i/p.ds.length)+'%"></i></div><div class="the">';
  if(q.dang==='chon'){
    h += '<div class="mo">Chọn đáp án đúng</div><div class="cau-hoi">'+esc(q.hoi).replace(/\s*Question:\s*/, '\n\nQuestion: ')+'</div><div class="lua-chon">' + q.lc.map(function(x){
      var c=''; if(daLam){ if(x===q.dap_an) c='dung'; else if(x===p.da) c='sai'; }
      return '<button class="'+c+'" data-x="'+esc(x)+'"'+(daLam?' disabled':'')+'>'+esc(x)+'</button>'; }).join('') + '</div>';
  } else if(q.dang==='dien'){
    h += '<div class="mo">Điền vào chỗ trống</div><div class="cau-hoi">'+esc(q.hoi)+'</div>' +
         '<input type="text" id="o-dien" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án"'+(daLam?' disabled value="'+esc(p.da)+'"':'')+'>' +
         (daLam?'':'<div style="height:12px"></div><button class="nut chinh rong" id="kiem">Kiểm tra</button>');
  } else {
    if(!p.xepTu){ p.xepTu = tron(q.dap_an.split(/\s+/).map(function(w, i){ return { w:w, i:i }; })); p.xep = []; }
    h += '<div class="mo">Sắp xếp thành câu đúng</div>' + (q.vi ? '<div class="cau-hoi" style="font-weight:500">'+esc(q.vi)+'</div>' : '') +
         '<div class="o-chu" id="o-xep">' + p.xep.map(function(k, n){ return '<button class="chip" data-bo="'+n+'"'+(daLam?' disabled':'')+'>'+esc(p.xepTu[k].w)+'</button>'; }).join('') + '</div>' +
         '<div class="hang">' + p.xepTu.map(function(o, k){ return '<button class="chip'+(p.xep.indexOf(k)>=0?' da-dung':'')+'" data-them="'+k+'"'+(daLam?' disabled':'')+'>'+esc(o.w)+'</button>'; }).join('') + '</div>' +
         (daLam?'':'<div style="height:12px"></div><button class="nut chinh rong" id="kiem"'+(p.xep.length<p.xepTu.length?' disabled':'')+'>Kiểm tra</button>');
  }
  if(daLam){
    var ok = p.ok;
    h += '<div class="phan-hoi '+(ok?'dung':'sai')+'"><b>'+(ok?'Đúng rồi!':'Chưa đúng. Đáp án: '+esc(q.dang==='chon'?q.dap_an:(q.dang==='dien'?q.dap_an:q.dap_an)))+'</b>'+esc(q.giai_thich||'')+'</div>';
    if(q.dang==='sapxep') h += '<div class="hang" style="margin-top:10px"><button class="nut nho" id="nghe-cau">🔊 Nghe câu này</button></div>';
    h += '<div style="height:12px"></div><button class="nut chinh rong" id="tiep">'+(p.i<p.ds.length-1?'Câu tiếp':'Xem kết quả')+'</button>';
  }
  h += '</div>'; v.innerHTML = h;
  var cham = function(traLoi, ok){
    p.da = traLoi; p.ok = ok; if(ok) p.dung++;
    else p.sai.push((q.dang==='sapxep' ? (q.vi||'') : q.hoi) + ' → ' + q.dap_an + (traLoi ? ' (bạn trả lời: '+traLoi+')' : ''));
    veLai();
  };
  if(q.dang==='chon') v.querySelectorAll('.lua-chon button').forEach(function(x){ x.onclick = function(){ cham(x.dataset.x, x.dataset.x===q.dap_an); }; });
  if(q.dang==='dien' && !daLam){
    var o = document.getElementById('o-dien'); setTimeout(function(){ o.focus(); }, 50);
    var kiem = function(){ var t = chuanHoa(o.value); if(!t){ bao('Bạn gõ đáp án trước nhé'); return; }
      var ds = (q.chap_nhan && q.chap_nhan.length ? q.chap_nhan : [q.dap_an]).map(chuanHoa);
      cham(o.value.trim(), ds.indexOf(t)>=0); };
    document.getElementById('kiem').onclick = kiem; o.onkeydown = function(e){ if(e.key==='Enter') kiem(); };
  }
  if(q.dang==='sapxep' && !daLam){
    v.querySelectorAll('[data-them]').forEach(function(x){ x.onclick = function(){ p.xep.push(+x.dataset.them); veLai(); }; });
    v.querySelectorAll('[data-bo]').forEach(function(x){ x.onclick = function(){ p.xep.splice(+x.dataset.bo, 1); veLai(); }; });
    var kiem2 = document.getElementById('kiem'); if(kiem2) kiem2.onclick = function(){
      var cau = p.xep.map(function(k){ return p.xepTu[k].w; }).join(' ');
      cham(cau, chuanHoa(cau) === chuanHoa(q.dap_an));
    };
  }
  var ng = document.getElementById('nghe-cau'); if(ng) ng.onclick = function(){ docTo(q.dap_an); };
  var tiep = document.getElementById('tiep'); if(tiep) tiep.onclick = function(){ p.i++; p.da=null; p.ok=null; p.xepTu=null; p.xep=[]; veLai(); window.scrollTo(0,0); };
}

/* --- Tổng kết một phần --- */
function veTongKet(v, b, phan, dung, tong, sai, lamLai){
  var pt = tong ? Math.round(100*dung/tong) : 0;
  if(!p.daGui){ p.daGui = true; guiKetQua(b, phan, dung, tong, sai.join(' || ')); }
  var h = '<div class="the giua"><div class="mo">Kết quả</div><div class="lon">'+dung+'/'+tong+'</div><span class="diem '+muc(pt)+'">'+pt+'%</span>' +
          '<p>'+(pt>=85?'Tuyệt vời! Bạn nắm bài rất chắc.':pt>=60?'Khá tốt! Xem lại các câu sai bên dưới nhé.':'Chưa sao cả, ôn lại rồi làm lần nữa nhé.')+'</p>' +
          (API?'<div class="mo">Kết quả đã được gửi cho giáo viên.</div>':'') + '</div>';
  if(sai.length) h += '<div class="the"><b>Cần ôn lại</b><ul class="sai-list">' + sai.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('') + '</ul></div>';
  h += '<div class="hang"><button class="nut gian" id="lam-lai">Làm lại</button><button class="nut chinh gian" id="phan-sau">Phần tiếp theo</button></div>';
  v.innerHTML = h;
  document.getElementById('lam-lai').onclick = lamLai;
  document.getElementById('phan-sau').onclick = function(){
    var thu = ['tu','bai','noi','nghe'], i = thu.indexOf(phan === 'kt' ? 'tu' : phan);
    if(i < thu.length-1){ st.phan = thu[i+1]; batDauPhan(); } else st.man = 'chu';
    veLai(); window.scrollTo(0,0);
  };
}

/* --- Nói theo --- */
function veNoiTheo(v, b){
  var muc_ = b.luyen_am.map(function(x){ return { en:x.en, phu:(x.ipa||'') + (x.ghi_chu ? ' · '+x.ghi_chu : '') }; })
     .concat(b.cau.map(function(x){ return { en:x.en, phu:x.vi||'' }; }));
  if(!muc_.length){ v.innerHTML = '<p class="mo">Buổi này chưa có phần luyện nói.</p>'; return; }
  var h = '';
  if(!SR) h += '<div class="canh-bao">'+esc(loiMic('khong-ho-tro'))+' Bạn vẫn nghe mẫu và nói theo được, chỉ là máy không chấm điểm.</div>';
  h += '<div class="the mo" style="font-size:14px">Bấm 🔊 nghe mẫu, rồi bấm 🎤 và đọc to. Chữ <span class="w-dung">xanh</span> là máy nghe đúng, chữ <span class="w-sai">đỏ</span> là cần đọc lại. Bật “Ẩn chữ” để luyện nghe trước khi nhìn.</div>';
  h += '<div class="hang" style="margin-bottom:12px"><label class="hang gian" style="gap:8px;cursor:pointer"><input type="checkbox" id="an"'+(p.an?' checked':'')+'> Ẩn chữ (luyện nghe)</label></div>';
  var soAm = b.luyen_am.length;
  muc_.forEach(function(m, i){
    if(i===0 && soAm) h += '<h3 style="margin:18px 0 8px;font-size:16px">Luyện âm · '+esc(b.phat_am)+'</h3>';
    if(i===soAm) h += '<h3 style="margin:18px 0 8px;font-size:16px">Câu nói</h3>';
    var k = p.ket[i];
    h += '<div class="the muc-noi"><div class="hang"><div class="gian"><div class="en'+(p.an && !k?' an':'')+'">'+esc(m.en)+'</div><div class="mo'+(p.an && !k?' an':'')+'">'+esc(m.phu)+'</div></div>' +
         (k?'<span class="diem '+muc(k)+'">'+k+'%</span>':'') + '</div>' +
         '<div class="hang" style="margin-top:10px"><button class="nut nho" data-i="'+i+'" data-c="0">🔊 Nghe</button><button class="nut nho" data-i="'+i+'" data-c="1">🐢 Chậm</button><button class="nut nho nut-mic" data-mic="'+i+'">🎤 Nói</button></div><div id="kq-'+i+'"></div></div>';
  });
  var daNoi = Object.keys(p.ket).length;
  h += '<button class="nut chinh rong" id="nop"'+(daNoi?'':' disabled')+'>Nộp kết quả ('+daNoi+'/'+muc_.length+' câu đã nói)</button>';
  v.innerHTML = h;
  document.getElementById('an').onchange = function(e){ p.an = e.target.checked; veLai(); };
  v.querySelectorAll('[data-c]').forEach(function(x){ x.onclick = function(){ docTo(muc_[+x.dataset.i].en, x.dataset.c==='1'); }; });
  v.querySelectorAll('[data-mic]').forEach(function(x){
    var i = +x.dataset.mic;
    ganMic(x, muc_[i].en, document.getElementById('kq-'+i), function(k){
      if(!p.ket[i] || k.phanTram > p.ket[i]) p.ket[i] = k.phanTram;
      var nop = document.getElementById('nop'), n = Object.keys(p.ket).length;
      nop.disabled = false; nop.textContent = 'Nộp kết quả ('+n+'/'+muc_.length+' câu đã nói)';
      var the = x.closest('.muc-noi'); the.querySelectorAll('.an').forEach(function(e){ e.classList.remove('an'); });
    });
  });
  document.getElementById('nop').onclick = function(){
    var tong = 0, chi = []; muc_.forEach(function(m, i){ var d = p.ket[i]||0; tong += d; if(d<85) chi.push(m.en+' ('+d+'%)'); });
    var pt = Math.round(tong/muc_.length);
    p.daGui = false;
    var vung = document.getElementById('noi-dung');
    p = { an:p.an, ket:p.ket };
    veTongKet(vung, b, 'noi', pt, 100, chi, function(){ st.phan='noi'; batDauPhan(); veLai(); });
    vung.querySelector('.lon').textContent = pt + '%';
  };
}

/* --- Nghe chép --- */
function veNgheChep(v, b){
  if(!p.ds.length){ v.innerHTML = '<p class="mo">Buổi này chưa có câu để nghe.</p>'; return; }
  if(p.i >= p.ds.length){
    var sai = p.ket.filter(function(k){ return k.pt < 100; }).map(function(k){ return k.en + ' (bạn chép: ' + k.chep + ')'; });
    return veTongKet(v, b, 'nghe', p.ket.filter(function(k){ return k.pt===100; }).length, p.ds.length, sai, function(){ batDauPhan(); veLai(); });
  }
  var q = p.ds[p.i];
  var h = '<div class="hang mo"><span class="gian">Câu '+(p.i+1)+'/'+p.ds.length+'</span><span>Nghe rồi gõ lại câu</span></div>' +
          '<div class="tien-do"><i style="width:'+Math.round(100*p.i/p.ds.length)+'%"></i></div><div class="the">' +
          '<div class="hang" style="margin-bottom:12px"><button class="nut" id="n1">🔊 Nghe</button><button class="nut" id="n2">🐢 Nghe chậm</button></div>' +
          '<input type="text" id="o-chep" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu bạn nghe được"'+(p.da?' disabled value="'+esc(p.da.chep)+'"':'')+'>';
  if(!p.da) h += '<div style="height:12px"></div><button class="nut chinh rong" id="kiem">Kiểm tra</button>';
  else {
    h += '<div class="ket-qua-noi" style="margin-top:12px"><span class="diem '+muc(p.da.pt)+'">'+p.da.pt+'%</span><div style="margin-top:6px">'+veKhop(p.da.k)+'</div><div class="mo">'+esc(q.vi||'')+'</div></div>' +
         '<div style="height:12px"></div><button class="nut chinh rong" id="tiep">'+(p.i<p.ds.length-1?'Câu tiếp':'Xem kết quả')+'</button>';
  }
  h += '</div>'; v.innerHTML = h;
  document.getElementById('n1').onclick = function(){ docTo(q.en); };
  document.getElementById('n2').onclick = function(){ docTo(q.en, true); };
  if(!p.da){
    if(!p.daDoc){ p.daDoc = true; setTimeout(function(){ docTo(q.en); }, 250); }
    var o = document.getElementById('o-chep');
    var kiem = function(){ if(!o.value.trim()){ bao('Bạn gõ câu nghe được trước nhé'); return; }
      var k = soKhop(q.en, o.value); p.da = { chep:o.value.trim(), k:k, pt:k.phanTram }; p.ket.push({ en:q.en, chep:o.value.trim(), pt:k.phanTram }); veLai(); };
    document.getElementById('kiem').onclick = kiem; o.onkeydown = function(e){ if(e.key==='Enter') kiem(); };
  } else document.getElementById('tiep').onclick = function(){ p.i++; p.da=null; p.daDoc=false; veLai(); };
}

/* ---------- chạy ---------- */
function veLai(){
  if(!nguoiHoc) return veDangNhap();
  if(st.man==='buoi' && st.buoi){
    var moi = dsBuoi.filter(function(b){ return b.gd===st.buoi.gd && b.buoi===st.buoi.buoi; })[0];
    if(moi && moi !== st.buoi){ st.buoi = moi; batDauPhan(); }
    return veBuoi();
  }
  veTrangChu();
}
taiNoiDungSheet();
guiHangCho();
window.addEventListener('online', guiHangCho);
veLai();
})();
</script>
