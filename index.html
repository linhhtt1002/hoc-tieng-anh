<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Học tiếng Anh mỗi ngày</title>
<meta name="theme-color" content="#3b5bdb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nen:#f4f6fb; --the:#ffffff; --chu:#1d2433; --phu:#667085; --vien:#e3e7ef;
  --chinh:#3b5bdb; --chinh-nhat:#e8edff; --dung:#12925a; --dung-nhat:#e3f6ec;
  --sai:#d6453d; --sai-nhat:#fdeceb; --vang:#b7791f; --vang-nhat:#fdf3e1;
  --bo:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--nen);color:var(--chu);font:16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.khung{max-width:560px;margin:0 auto;padding:0 16px 96px}
.dau{position:sticky;top:0;z-index:5;background:var(--nen);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
.dau h1{font-size:18px;margin:0;flex:1;line-height:1.3}
.dau .nho{font-size:13px;color:var(--phu);font-weight:400;display:block}
.nut-tron{width:40px;height:40px;border-radius:50%;border:1px solid var(--vien);background:var(--the);display:grid;place-items:center;cursor:pointer;flex:none;font-size:18px}
.the{background:var(--the);border:1px solid var(--vien);border-radius:var(--bo);padding:16px;margin:0 0 12px}
.nut{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--vien);background:var(--the);cursor:pointer;font-weight:600}
.nut.chinh{background:var(--chinh);border-color:var(--chinh);color:#fff}
.nut.rong{width:100%}
.nut:disabled{opacity:.45;cursor:default}
.nut.nho{min-height:38px;padding:6px 12px;font-size:14px}
.hang{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hang>.gian{flex:1}
input[type=text],input[type=tel]{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--vien);border-radius:12px;background:#fff;font-size:17px}
input:focus{outline:2px solid var(--chinh);outline-offset:1px}
label.nhan{display:block;font-weight:600;margin:12px 0 6px}
.mo{color:var(--phu);font-size:14px}
.tab-gd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:2px 0 12px}
.tab-gd button{border:1px solid var(--vien);background:var(--the);border-radius:12px;padding:7px 2px;cursor:pointer;font-size:12px;line-height:1.3;text-align:center}
.tab-gd button b{display:block;font-size:14px}
.tab-gd button.chon{background:var(--chinh);color:#fff;border-color:var(--chinh)}
.buoi{cursor:pointer;display:block;width:100%;text-align:left}
.buoi .so{font-size:13px;color:var(--chinh);font-weight:600}
.buoi .ten{font-weight:600;margin:2px 0 4px}
.buoi .np{font-size:13px;color:var(--phu)}
.cham{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cham span{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--nen);color:var(--phu)}
.cham span.xong{background:var(--dung-nhat);color:var(--dung)}
.tab-phan{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--the);border:1px solid var(--vien);border-radius:12px;padding:4px;margin-bottom:14px}
.tab-phan button{border:0;background:none;padding:8px 1px;border-radius:9px;cursor:pointer;font-size:12px;line-height:1.25;font-weight:600;color:var(--phu)}
.ly h3{margin:0 0 8px;font-size:16px;color:var(--chinh)}
.ly ul{margin:0;padding-left:18px}
.ly li{margin-bottom:6px}
.ly .vd-dong{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;background:var(--nen);border-radius:10px;margin-top:8px}
.ly .vd-dong .gian{flex:1}
.cau-loi{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.cau-loi button{padding:8px 10px;border-radius:10px;border:1px solid var(--vien);background:#fff;cursor:pointer;font-size:17px}
.cau-loi button.dung{background:var(--dung-nhat);border-color:var(--dung);color:var(--dung);font-weight:600}
.cau-loi button.sai{background:var(--sai-nhat);border-color:var(--sai);color:var(--sai)}
.the-ipa{display:flex;align-items:center;gap:14px;cursor:pointer;width:100%;text-align:left}
.the-ipa .kh{font-size:22px;font-weight:700;min-width:64px;text-align:center;color:var(--chinh);background:var(--chinh-nhat);border-radius:12px;padding:6px 4px}
.luoi-ipa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.luoi-ipa button{border:1px solid var(--vien);background:var(--the);border-radius:12px;padding:10px 2px;cursor:pointer;text-align:center}
.luoi-ipa button b{display:block;font-size:19px}
.luoi-ipa button span{font-size:11px;color:var(--phu)}
.luoi-ipa button.xong{border-color:var(--dung);background:var(--dung-nhat)}
.vao-ipa{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#3b5bdb,#7048e8);color:#fff;border:0;border-radius:var(--bo);padding:14px 16px;width:100%;text-align:left;cursor:pointer;margin-bottom:14px}
.vao-ipa b{display:block;font-size:16px}
.vao-ipa span{font-size:13px;opacity:.9}
.tab-phan button.chon{background:var(--chinh-nhat);color:var(--chinh)}
.the-tu{text-align:center;padding:28px 16px}
.the-tu .en{font-size:30px;font-weight:700;margin:0}
.ipa{color:var(--phu);font-size:16px}
.the-tu .vi{font-size:20px;font-weight:600;color:var(--chinh);margin-top:14px}
.vd{margin-top:12px;padding:12px;border-radius:12px;background:var(--nen);text-align:left}
.tien-do{height:6px;background:var(--vien);border-radius:6px;overflow:hidden;margin:4px 0 14px}
.tien-do i{display:block;height:100%;background:var(--chinh);transition:width .3s}
.cau-hoi{font-size:19px;font-weight:600;margin:4px 0 14px;white-space:pre-line}
.lua-chon{display:grid;gap:8px}
.lua-chon button{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--vien);background:#fff;cursor:pointer;font-size:16px}
.lua-chon button.dung{background:var(--dung-nhat);border-color:var(--dung);color:var(--dung);font-weight:600}
.lua-chon button.sai{background:var(--sai-nhat);border-color:var(--sai);color:var(--sai)}
.phan-hoi{margin-top:14px;padding:12px 14px;border-radius:12px}
.phan-hoi.dung{background:var(--dung-nhat)}
.phan-hoi.sai{background:var(--sai-nhat)}
.phan-hoi b{display:block}
.o-chu{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:2px dashed var(--vien);border-radius:12px;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:10px;border:1px solid var(--vien);background:#fff;cursor:pointer;font-size:16px}
.chip.da-dung{visibility:hidden}
.muc-noi .en{font-size:19px;font-weight:600}
.muc-noi .an{filter:blur(6px);user-select:none}
.ket-qua-noi{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--nen);font-size:15px}
.w-dung{color:var(--dung);font-weight:600}
.w-sai{color:var(--sai);text-decoration:underline wavy;text-underline-offset:4px}
.diem{display:inline-block;font-weight:700;padding:2px 10px;border-radius:999px;font-size:14px}
.diem.tot{background:var(--dung-nhat);color:var(--dung)}
.diem.kha{background:var(--vang-nhat);color:var(--vang)}
.diem.yeu{background:var(--sai-nhat);color:var(--sai)}
.nut-mic{background:var(--sai);border-color:var(--sai);color:#fff}
.nut-mic.dang-nghe{animation:nhap 1s infinite}
@keyframes nhap{50%{opacity:.6}}
.chuyen{display:flex;gap:6px;margin-bottom:12px}
.chuyen button{flex:1;border:1px solid var(--vien);background:var(--the);border-radius:10px;padding:8px;cursor:pointer;font-size:14px;font-weight:600}
.chuyen button.chon{background:var(--chu);color:#fff;border-color:var(--chu)}
.thong-bao{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--chu);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.thong-bao.hien{opacity:1}
.lon{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.giua{text-align:center}
ul.sai-list{padding-left:18px;margin:8px 0}
ul.sai-list li{margin-bottom:8px}
.canh-bao{background:var(--vang-nhat);color:#7a4f10;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<div class="khung" id="app"></div>
<div class="thong-bao" id="thong-bao"></div>
<script src="cau-hinh.js?v=12"></script>
<script src="noi-dung.js?v=12"></script>
<script src="ipa.js?v=12"></script>
<script>
(function(){
'use strict';
var GD_TEN = {1:'0 → A1',2:'A1 → A2',3:'A2 → A2+',4:'A2+ → B1',5:'B1 → B1+'};
var PHAN = [
  {ma:'tu', ten:'Từ vựng'},
  {ma:'bai', ten:'Bài tập'},
  {ma:'noi', ten:'Nói theo'},
  {ma:'nghe', ten:'Nghe chép'}
];
var TAB = [{ma:'ly', ten:'Bài học'}].concat(PHAN).concat([{ma:'game', ten:'🎮 Trò chơi'}]);
var TEN_PHAN = {tu:'Từ vựng', bai:'Bài tập', noi:'Nói theo', nghe:'Nghe chép', ipa:'Phát âm IPA'};
var DS_IPA = (window.IPA && window.IPA.am) || [];
// Âm thanh từng âm: phát trực tiếp từ trang IELTS Fighter (ielts-fighter.com), không lưu bản sao
var GOC_AM = 'https://st.ielts-fighter.com/src/ielts-fighter/2019/09/09/';
var FILE_AM = {'ɪ':'i ngắn','iː':'i dài','e':'e','ə':'ơ ngắn','ɜː':'ơ dài','ʊ':'u ngắn','uː':'u dài','ɒ':'o ngắn','ɔː':'o dài','ʌ':'a ngắn','ɑː':'a dài','æ':'ae',
  'ɪə':'ie','eə':'ea','eɪ':'ei','ɔɪ':'oi','aɪ':'aɪ','əʊ':'əʊ','aʊ':'aʊ','ʊə':'ʊə',
  'p':'p','b':'b','t':'t','d':'d','tʃ':'t∫','dʒ':'dʒ','k':'k','ɡ':'g','g':'g','f':'f','v':'v','θ':'θ','ð':'ð','s':'s','z':'z','ʃ':'∫','ʒ':'ʒ',
  'm':'m','n':'n','ŋ':'η','h':'h','l':'l','r':'r','w':'w','j':'j'};
var loaAm = null;
function phatAm(kiHieu){
  var k = String(kiHieu).replace(/\//g,'').replace(/:/g,'ː'), ten = FILE_AM[k];
  if(!ten){ bao('Âm này chưa có file đọc mẫu.'); return; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(loaAm) loaAm.pause();
  loaAm = new Audio(GOC_AM + encodeURIComponent(ten) + '.mp3');
  loaAm.play().catch(function(){ bao('Chưa phát được âm thanh. Kiểm tra mạng rồi bấm lại nhé.'); });
}
var API = (window.API_URL || '').trim();
var $app = document.getElementById('app');

/* ---------- lưu trên máy ---------- */
function doc(k, macDinh){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : macDinh; }catch(e){ return macDinh; } }
function ghi(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var nguoiHoc = doc('nguoiHoc', null);
var tienDo = doc('tienDo', {});      // "gd-buoi-phan" -> % cao nhất
var dsBuoi = (window.NOI_DUNG || []).slice();
var st = { man:'chu', gd: doc('gdDangHoc', 1), buoi:null, phan:'tu' };

/* ---------- tiện ích ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function tron(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function bao(chu){ var b=document.getElementById('thong-bao'); b.textContent=chu; b.classList.add('hien'); clearTimeout(bao._t); bao._t=setTimeout(function(){ b.classList.remove('hien'); }, 2600); }
function muc(p){ return p>=85 ? 'tot' : (p>=60 ? 'kha' : 'yeu'); }
function khoa(b, phan){ return b.gd + '-' + b.buoi + '-' + phan; }
function chuanHoa(s){ return String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?]+$/,''); }

/* ---------- đọc to (giọng có sẵn trên máy) ---------- */
var giong = null;
function chonGiong(){
  if(!('speechSynthesis' in window)) return;
  var ds = speechSynthesis.getVoices().filter(function(v){ return /^en[-_]/i.test(v.lang); });
  var uuTien = ds.filter(function(v){ return /en[-_]US/i.test(v.lang) && /Google|Samantha|Aria|Jenny|Microsoft/i.test(v.name); });
  giong = uuTien[0] || ds.filter(function(v){ return /en[-_](US|GB)/i.test(v.lang); })[0] || ds[0] || null;
}
if('speechSynthesis' in window){ chonGiong(); speechSynthesis.onvoiceschanged = chonGiong; }
function docTo(text, cham){
  if(!('speechSynthesis' in window)){ bao('Máy này không đọc được tiếng. Hãy mở bằng Chrome hoặc Safari.'); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = giong ? giong.lang : 'en-US';
  if(giong) u.voice = giong;
  u.rate = cham ? 0.6 : 0.9;
  speechSynthesis.speak(u);
}

/* ---------- nghe giọng người học ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var dangNghe = null;
var LA_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var TRONG_APP_CHAT = /Zalo|FBAN|FBAV|FB_IAB|Instagram|Messenger|Line\//i.test(navigator.userAgent);
// Chrome Android trả "kết quả cuối" rồi tự dừng; Safari iPhone thường chỉ trả "kết quả tạm" và không tự dừng,
// nên: gom cả kết quả tạm, tự dừng sau 1,5 giây im lặng, tối đa 10 giây, và luôn tự kết thúc dù trình duyệt không báo.
// Dùng lại MỘT bộ nghe cho cả trang (iPhone hay chỉ chạy được lần đầu nếu mỗi lần tạo bộ mới rồi huỷ ngang).
var boNghe = null, boNgheDangChay = false, phienNghe = null, soLanHong = 0;
function taoBoNghe(){
  var r = new SR();
  r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
  r.onstart = function(){ boNgheDangChay = true; };
  r.onresult = function(e){ if(phienNghe) phienNghe.ketQua(e); };
  r.onspeechstart = function(){ if(phienNghe) phienNghe.coTieng = true; };
  r.onerror = function(e){ if(phienNghe) phienNghe.loi(e.error); };
  r.onend = function(){ boNgheDangChay = false; if(phienNghe) phienNghe.ketThuc(); };
  return r;
}
function tatAmKhac(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(loaAm){ try{ loaAm.pause(); }catch(e){} }
  if(amCtx && amCtx.state === 'running'){ try{ amCtx.suspend(); }catch(e){} }
}
function ngheNguoiHoc(xong, loi){
  if(TRONG_APP_CHAT){ loi('trong-app-chat'); return; }
  SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ loi('khong-ho-tro'); return; }
  if(dangNghe){ dangNghe.huy(); }
  tatAmKhac();
  var ph = { cuoi:[], tam:'', daXong:false, coTieng:false, henIm:null, henToiDa:null };
  function ketThuc(maLoi){
    if(ph.daXong) return; ph.daXong = true;
    clearTimeout(ph.henIm); clearTimeout(ph.henToiDa);
    if(phienNghe === ph) phienNghe = null;
    dangNghe = null;
    if(boNgheDangChay){ try{ boNghe.stop(); }catch(e){} }   // dừng nhẹ nhàng, không huỷ ngang
    // ngoài câu ghép, thử cả từng đoạn riêng mà máy gửi (iPhone hay gửi trùng) để chấm theo cách hiểu tốt nhất
    var ds = ph.cuoi.length ? ph.cuoi.concat(ph.doan || []) : (ph.tam ? [ph.tam].concat(ph.doan || []) : []);
    if(ds.length){ soLanHong = 0; xong(ds); }
    else { soLanHong++; loi(maLoi || (ph.coTieng ? 'khong-ro' : 'no-speech')); }
  }
  function dungSau(ms){ clearTimeout(ph.henIm); ph.henIm = setTimeout(function(){ try{ boNghe.stop(); }catch(e){} setTimeout(function(){ ketThuc(); }, 900); }, ms); }
  ph.ketThuc = function(){ ketThuc(); };
  ph.ketQua = function(e){
    ph.coTieng = true;
    var t = [];
    for(var i=0;i<e.results.length;i++){
      var kq = e.results[i];
      if(kq.isFinal && i >= e.resultIndex){ for(var j=0;j<kq.length;j++) if(kq[j].transcript) ph.cuoi.push(kq[j].transcript); }
      t.push(kq[0].transcript);
    }
    ph.tam = t.join(' ').trim();
    ph.doan = t.map(function(x){ return String(x||'').trim(); }).filter(Boolean);
    dungSau(1500);
  };
  ph.loi = function(ma){
    if(ma === 'no-speech') return ketThuc();
    if(ma === 'aborted') return ketThuc(ph.tam || ph.cuoi.length ? null : 'bi-ngat');
    ketThuc(ma);
  };
  var batDau = function(){
    if(!boNghe) boNghe = taoBoNghe();
    phienNghe = ph;
    boNghe.start();
  };
  try{ batDau(); }
  catch(e){
    // bộ nghe cũ bị kẹt: bỏ đi, tạo bộ mới và thử lại một lần
    try{ boNghe.abort(); }catch(_){}
    boNghe = null; boNgheDangChay = false;
    try{ batDau(); }catch(e2){ phienNghe = null; soLanHong++; loi('khong-bat-dau'); return; }
  }
  ph.henToiDa = setTimeout(function(){ try{ boNghe.stop(); }catch(e){} setTimeout(function(){ ketThuc(); }, 1200); }, 10000);
  dangNghe = {
    dung: function(){ try{ boNghe.stop(); }catch(e){} setTimeout(function(){ ketThuc(); }, 900); },
    huy: function(){ if(ph.daXong) return; ph.daXong = true; clearTimeout(ph.henIm); clearTimeout(ph.henToiDa); if(phienNghe === ph) phienNghe = null; dangNghe = null; try{ boNghe.stop(); }catch(e){} loi('huy'); }
  };
}
function loiMic(ma){
  if(ma === 'trong-app-chat') return 'Bạn đang mở trang bên trong Zalo/Facebook nên không dùng được micro. Bấm dấu ⋯ ở góc trên, chọn "Mở bằng trình duyệt" (Safari trên iPhone, Chrome trên Android) rồi thử lại.';
  if(ma === 'khong-ho-tro') return LA_IOS
    ? 'Trình duyệt này chưa chấm được giọng nói. Trên iPhone hãy mở link bằng Safari.'
    : 'Trình duyệt này chưa chấm được giọng nói. Hãy mở link bằng Chrome.';
  if(ma === 'not-allowed') return LA_IOS
    ? 'Chưa được phép dùng micro. Vào Cài đặt → Safari → Micrô → chọn Cho phép (hoặc Hỏi), rồi tải lại trang và thử lại.'
    : 'Chưa được phép dùng micro. Bấm vào biểu tượng ổ khoá cạnh địa chỉ trang, cho phép Micro rồi thử lại.';
  if(ma === 'service-not-allowed') return LA_IOS
    ? 'iPhone đang tắt tính năng nhận giọng nói. Vào Cài đặt → Chung → Bàn phím → bật "Bật Đọc chính tả", rồi thử lại.'
    : 'Máy chưa cho phép nhận giọng nói. Kiểm tra quyền Micro của trình duyệt rồi thử lại.';
  if(ma === 'no-speech') return 'Chưa nghe thấy gì. Bấm nút, đợi chữ "Đang nghe..." hiện ra rồi nói to, rõ hơn nhé.';
  if(ma === 'audio-capture') return 'Không mở được micro. Kiểm tra máy có đang gọi điện hay app khác đang dùng micro không, rồi thử lại.';
  if(ma === 'network') return 'Mạng yếu nên chưa chấm được. Thử lại sau vài giây.';

var VIET_TAT = {"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","there's":"there is","what's":"what is","where's":"where is","who's":"who is","how's":"how is","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","we'll":"we will","they'll":"they will","it'll":"it will","i'd":"i would","you'd":"you would","he'd":"he would","she'd":"she would","we'd":"we would","they'd":"they would","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","haven't":"have not","hasn't":"has not","hadn't":"had not","shouldn't":"should not","wouldn't":"would not","couldn't":"could not","mustn't":"must not","let's":"let us"};
var SO = {'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve'};
function tachTu(chu){
  return chuanHoa(chu).replace(/[^a-z0-9' -]/g,' ').replace(/-/g,' ').split(' ').filter(Boolean).map(function(w){
    w = w.replace(/^'+|'+$/g,'');
    if(VIET_TAT[w]) return VIET_TAT[w].split(' ');
    if(SO[w]) return [SO[w]];
    if(/'s$/.test(w)) return [w.slice(0,-2)];
    if(w === 'ok' || w === 'okay') return ['okay'];
    return [w];
  });
}
function soKhop(mau, noi){
  var nhom = tachTu(mau), dich = [], chu = [];
  nhom.forEach(function(g, i){ g.forEach(function(t){ dich.push(t); chu.push(i); }); });
  var n0 = [].concat.apply([], tachTu(noi)), n = [];
  for(var x=0;x<n0.length;x++){
    if(x+1<n0.length && dich.indexOf(n0[x])<0 && dich.indexOf(n0[x]+n0[x+1])>=0){ n.push(n0[x]+n0[x+1]); x++; }
    else n.push(n0[x]);
  }
  // iPhone hay gửi lặp: "house house", "this is my this is my house" → bỏ phần lặp liền nhau nếu câu mẫu không có
  var lapTrongMau = function(arr, i, d){ for(var q=0;q<d;q++) if(arr[i+q] !== arr[i+d+q]) return false; return true; };
  var co = true;
  while(co){
    co = false;
    for(var d=Math.floor(n.length/2); d>=1 && !co; d--){
      for(var s=0; s+2*d<=n.length; s++){
        if(lapTrongMau(n, s, d)){
          var cum = n.slice(s, s+d).join(' '), coTrongMau = (' '+dich.join(' ')+' ').indexOf(' '+cum+' '+cum+' ') >= 0;
          if(!coTrongMau){ n.splice(s+d, d); co = true; break; }
        }
      }
    }
  }
  var A = dich.length, B = n.length, L = [];
  for(var i=0;i<=A;i++){ L.push(new Array(B+1).fill(0)); }
  for(i=A-1;i>=0;i--) for(var j=B-1;j>=0;j--) L[i][j] = dich[i]===n[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  var khop = new Array(A).fill(false); i=0; j=0;
  while(i<A && j<B){ if(dich[i]===n[j]){ khop[i]=true; i++; j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  var tu = mau.trim().split(/\s+/);
  var tuOk = new Array(nhom.length).fill(true);
  khop.forEach(function(k, t){ if(!k) tuOk[chu[t]] = false; });
  var soDung = khop.filter(Boolean).length;
  var thua = Math.max(0, B - soDung);
  var p = A ? Math.round(100 * soDung / (A + thua*0.25)) : 0;
  return { phanTram: Math.min(100,p), tu: tu, dung: tu.map(function(_, i){ return tuOk[i] !== undefined ? tuOk[i] : true; }), duHet: soDung === A, thua: thua };
}
function chamNoi(mau, cac){
  var tot = null, nghe = '';
  cac.forEach(function(c){ var k = soKhop(mau, c); if(!tot || k.phanTram > tot.phanTram){ tot = k; nghe = c; } });
  tot.nghe = nghe; return tot;
}
function veKhop(k){
  return k.tu.map(function(w, i){ return '<span class="' + (k.dung[i] ? 'w-dung' : 'w-sai') + '">' + esc(w) + '</span>'; }).join(' ');
}

var amCtx = null;
function tiengKeu(dung){
  try{
    amCtx = amCtx || new (window.AudioContext || window.webkitAudioContext)();
    var o = amCtx.createOscillator(), g = amCtx.createGain(), t = amCtx.currentTime;
    o.type = dung ? 'sine' : 'square';
    o.frequency.setValueAtTime(dung ? 880 : 180, t); if(dung) o.frequency.setValueAtTime(1320, t + 0.08);
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + (dung ? 0.25 : 0.2));
    if(amCtx.state === 'suspended') amCtx.resume();
    o.connect(g); g.connect(amCtx.destination); o.start(t); o.stop(t + 0.3);
    // nhả loa ngay sau khi kêu để iPhone còn mở được micro cho phần nói
    clearTimeout(tiengKeu.hen); tiengKeu.hen = setTimeout(function(){ try{ amCtx.suspend(); }catch(e){} }, 450);

}

/* ---------- Trò chơi (dùng từ vựng của buổi) ---------- */
var dongHo = null;

var kyLuc = doc('kyLuc', {});

var GAME = [
  { ma:'ghep', ten:'🃏 Lật thẻ ghép cặp', mo:'Lật 2 thẻ để ghép từ tiếng Anh với nghĩa. Càng ít lượt càng giỏi.' },
  { ma:'dua',  ten:'⏱️ Đua 60 giây', mo:'Trả lời thật nhanh trong 60 giây. Đúng liên tiếp được nhân điểm.' },

function veTroChoi(v, b){

  }

/* Game 2: đua 60 giây */
function cauDua(b){
  var t = b.tu[Math.floor(Math.random()*b.tu.length)];
  var khac = tron(b.tu.filter(function(x){ return x !== t; })).slice(0,3);
  var r = Math.random(), kieu = r < 0.4 ? 'en' : r < 0.75 ? 'vi' : 'nghe';
  if(kieu === 'vi') return { kieu:kieu, hoi:t.vi, dap:t.en, lc:tron([t.en].concat(khac.map(function(x){ return x.en; }))), t:t };
  return { kieu:kieu, hoi:t.en, dap:t.vi, lc:tron([t.vi].concat(khac.map(function(x){ return x.vi; }))), t:t };
}
function veGameDua(v, b){
  if(!p.cau) p.cau = cauDua(b);
  var con = Math.max(0, p.het - Date.now()), q = p.cau;
  var h = thoatGame() + '<span>Điểm: <b style="font-size:18px">'+p.diem+'</b>'+(p.combo>=2?' · 🔥 x'+Math.min(p.combo,5):'')+'</span></div>' +
    '<div class="tien-do" style="height:10px"><i id="thanh-gio" style="width:'+(con/600)+'%;background:'+(con<10000?'var(--sai)':'var(--chinh)')+'"></i></div>' +
    '<div class="the giua">' +
    (q.kieu==='nghe' ? '<div class="mo">Nghe và chọn nghĩa</div><button class="nut" id="nghe-dua" style="margin:10px 0">🔊 Nghe lại</button>'
                     : '<div class="mo">'+(q.kieu==='en'?'Nghĩa của từ này là gì?':'Từ tiếng Anh nào nghĩa là:')+'</div><div style="font-size:26px;font-weight:700;margin:8px 0 14px">'+esc(q.hoi)+'</div>') +
    '<div class="lua-chon" style="text-align:left">' + q.lc.map(function(x){
      var c = ''; if(p.da != null){ if(x === q.dap) c = 'dung'; else if(x === p.da) c = 'sai'; }
      return '<button class="'+c+'" data-x="'+esc(x)+'">'+esc(x)+'</button>'; }).join('') + '</div></div>';
  v.innerHTML = h; ganThoatGame();
  if(q.kieu==='nghe'){ document.getElementById('nghe-dua').onclick = function(){ docTo(q.t.en); }; if(!q.daDoc){ q.daDoc = true; docTo(q.t.en); } }
  var ketThuc = function(){
    dungDongHo();

    p = { game:'dua', xong:true, tieuDe:'Hết giờ! '+p.diem+' điểm', dong:['Trả lời đúng: '+p.dung+' câu', 'Trả lời sai: '+p.sai+' câu'], sao:sao + (kl?1:0), kyLucMoi:kl };
    veLai();

    var e = document.getElementById('thanh-gio'); if(!e || p.game!=='dua'){ dungDongHo(); return; }
    var c = Math.max(0, p.het - Date.now()); e.style.width = (c/600)+'%'; if(c < 10000) e.style.background = 'var(--sai)';
    if(c <= 0) ketThuc();

    else { p.combo = 0; p.sai++; tiengKeu(false); p.da = x.dataset.x; p.khoa = true; veLai();
      setTimeout(function(){ if(p.game!=='dua' || p.xong) return; p.khoa = false; p.da = null; p.cau = cauDua(b); veLai(); }, 900); }
  }; });

/* Game 3: ghép chữ */
function moTuChu(){
  var w = p.ds[p.i]; if(!w) return;
  p.chu = w.en.toLowerCase().split('').filter(function(c){ return /[a-z]/.test(c); });
  p.o = tron(p.chu.map(function(c, i){ return { c:c, i:i }; }));
  p.dien = []; p.dungTu = false;
}
function veGameChu(v, b){
  if(!p.ds.length){ v.innerHTML = '<p class="mo">Buổi này không có từ phù hợp cho game ghép chữ.</p>'; return; }
  if(p.i >= p.ds.length){
    var tong = p.ds.length*10, sao = p.diem >= tong*0.85 ? 3 : p.diem >= tong*0.6 ? 2 : 1, kl = luuKyLuc(b.gd+'-'+b.buoi+'-chu', p.diem, false);
    p = { game:'chu', xong:true, tieuDe:p.diem+'/'+tong+' điểm', dong:['Số lần dùng gợi ý: '+p.goiY, 'Số lần ghép sai: '+p.saiLan], sao:sao + (kl?1:0), kyLucMoi:kl };
    return veLai();
  }
  var w = p.ds[p.i], k = 0;
  var oTrong = w.en.split('').map(function(c){
    if(!/[A-Za-z]/.test(c)) return c === ' ' ? '<span style="width:12px"></span>' : '<span style="font-size:22px;font-weight:700">'+esc(c)+'</span>';
    var idx = k++, d = p.dien[idx];
    return '<span style="min-width:30px;height:42px;border-bottom:3px solid '+(p.dungTu?'var(--dung)':'var(--chinh)')+';display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:'+(p.dungTu?'var(--dung)':'var(--chu)')+'">'+(d!=null ? esc(p.o[d].c) : '')+'</span>';
  }).join('');
  var h = thoatGame() + '<span>Từ '+(p.i+1)+'/'+p.ds.length+' · Điểm: <b>'+p.diem+'</b></span></div>' +
    '<div class="the giua"><div class="mo">Viết từ tiếng Anh có nghĩa:</div><div style="font-size:22px;font-weight:700;margin:6px 0">'+esc(w.vi)+'</div>' +
    '<div class="hang" style="justify-content:center;margin-bottom:14px"><button class="nut nho" id="chu-nghe">🔊 Nghe</button><button class="nut nho" id="chu-goi-y">💡 Gợi ý (-3)</button></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px">'+oTrong+'</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">' + p.o.map(function(o, j){
      var daDung = p.dien.indexOf(j) >= 0;
      return '<button class="chip" data-c="'+j+'" style="min-width:44px;font-size:20px;font-weight:700;'+(daDung?'visibility:hidden':'')+'"'+(p.dungTu?' disabled':'')+'>'+esc(o.c)+'</button>'; }).join('') + '</div>' +
    '<div class="hang" style="justify-content:center;margin-top:14px"><button class="nut nho" id="chu-xoa"'+(p.dien.length&&!p.dungTu?'':' disabled')+'>⌫ Xoá</button><button class="nut nho" id="chu-bo">Bỏ qua</button></div></div>';
  v.innerHTML = h; ganThoatGame();
  document.getElementById('chu-nghe').onclick = function(){ docTo(w.en); };
  var sangTu = function(){ p.i++; moTuChu(); veLai(); };
  var kiem = function(){
    if(p.dien.length < p.chu.length) return;
    var viet = p.dien.map(function(j){ return p.o[j].c; }).join('');
    if(viet === p.chu.join('')){ p.dungTu = true; p.diem += Math.max(0, 10 - p.truTu); tiengKeu(true); docTo(w.en); veLai(); setTimeout(function(){ if(p.game==='chu' && !p.xong){ p.truTu = 0; sangTu(); } }, 1100); }
    else { p.saiLan++; tiengKeu(false); bao('Chưa đúng, thử lại nhé'); p.dien = []; veLai(); }
  };
  p.truTu = p.truTu || 0;
  v.querySelectorAll('[data-c]').forEach(function(x){ x.onclick = function(){ if(p.dungTu) return; p.dien.push(+x.dataset.c); veLai(); kiem(); }; });
  document.getElementById('chu-xoa').onclick = function(){ p.dien.pop(); veLai(); };
  document.getElementById('chu-bo').onclick = function(){ p.truTu = 0; sangTu(); };
  document.getElementById('chu-goi-y').onclick = function(){
    if(p.dungTu) return;
    // giữ phần đã đúng từ đầu, thêm đúng 1 chữ tiếp theo
    var dungDen = 0; while(dungDen < p.dien.length && p.o[p.dien[dungDen]].c === p.chu[dungDen]) dungDen++;
    p.dien = p.dien.slice(0, dungDen);
    var can = p.chu[dungDen], j = p.o.findIndex(function(o, jj){ return o.c === can && p.dien.indexOf(jj) < 0; });
    if(j >= 0){ p.dien.push(j); p.goiY++; p.truTu += 3; }
    veLai(); kiem();
  };
}

        return '<button data-am="'+i+'" class="'+(v!=null?'xong':'')+'"><b>'+esc(a.ki_hieu.replace(/\//g,''))+'</b><span>'+esc((a.tu[0]||{}).en||'')+(v!=null?' · '+v+'%':'')+'</span></button>'; }).join('') + '</div>';

function taoQuizAm(a){
  var cau = [];
  (a.cap_tu||[]).forEach(function(cap){ for(var k=0;k<2;k++){ var dung = cap[Math.random()<0.5?0:1]; cau.push({ doc:dung, lc:tron(cap.slice()) }); } });
  if(cau.length < 4){
    tron(a.tu).slice(0, 6 - cau.length).forEach(function(t){
      var khac = tron(a.tu.filter(function(x){ return x !== t; })).slice(0,2).map(function(x){ return x.en; });
      cau.push({ doc:t.en, lc:tron([t.en].concat(khac)) });
    });
  }
  return { ds: tron(cau), i:0, dung:0, da:null, sai:[] };
}

      if(!p.ket[i] || k.phanTram > p.ket[i]) p.ket[i] = k.phanTram;
      var nop = document.getElementById('nop'), n = Object.keys(p.ket).length;
      nop.disabled = false; nop.textContent = 'Nộp kết quả ('+n+'/'+muc_.length+' câu đã nói)';
      var the = x.closest('.muc-noi'); the.querySelectorAll('.an').forEach(function(e){ e.classList.remove('an'); });
    });
  });
  document.getElementById('nop').onclick = function(){
    var tong = 0, chi = []; muc_.forEach(function(m, i){ var d = p.ket[i]||0; tong += d; if(d<85) chi.push(m.en+' ('+d+'%)'); });
    var pt = Math.round(tong/muc_.length);
    p.daGui = false;
    var vung = document.getElementById('noi-dung');
    p = { an:p.an, ket:p.ket };
    veTongKet(vung, b, 'noi', pt, 100, chi, function(){ st.phan='noi'; batDauPhan(); veLai(); });
    vung.querySelector('.lon').textContent = pt + '%';
  };
}

/* --- Nghe chép --- */
function veNgheChep(v, b){
  if(!p.ds.length){ v.innerHTML = '<p class="mo">Buổi này chưa có câu để nghe.</p>'; return; }
  if(p.i >= p.ds.length){
    var sai = p.ket.filter(function(k){ return k.pt < 100; }).map(function(k){ return k.en + ' (bạn chép: ' + k.chep + ')'; });
    return veTongKet(v, b, 'nghe', p.ket.filter(function(k){ return k.pt===100; }).length, p.ds.length, sai, function(){ batDauPhan(); veLai(); });
  }
  var q = p.ds[p.i];
  var h = '<div class="hang mo"><span class="gian">Câu '+(p.i+1)+'/'+p.ds.length+'</span><span>Nghe rồi gõ lại câu</span></div>' +
          '<div class="tien-do"><i style="width:'+Math.round(100*p.i/p.ds.length)+'%"></i></div><div class="the">' +
          '<div class="hang" style="margin-bottom:12px"><button class="nut" id="n1">🔊 Nghe</button><button class="nut" id="n2">🐢 Nghe chậm</button></div>' +
          '<input type="text" id="o-chep" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu bạn nghe được"'+(p.da?' disabled value="'+esc(p.da.chep)+'"':'')+'>';
  if(!p.da) h += '<div style="height:12px"></div><button class="nut chinh rong" id="kiem">Kiểm tra</button>';
  else {
    h += '<div class="ket-qua-noi" style="margin-top:12px"><span class="diem '+muc(p.da.pt)+'">'+p.da.pt+'%</span><div style="margin-top:6px">'+veKhop(p.da.k)+'</div><div class="mo">'+esc(q.vi||'')+'</div></div>' +
         '<div style="height:12px"></div><button class="nut chinh rong" id="tiep">'+(p.i<p.ds.length-1?'Câu tiếp':'Xem kết quả')+'</button>';
  }
  h += '</div>'; v.innerHTML = h;
  document.getElementById('n1').onclick = function(){ docTo(q.en); };
  document.getElementById('n2').onclick = function(){ docTo(q.en, true); };
  if(!p.da){
    if(!p.daDoc){ p.daDoc = true; setTimeout(function(){ docTo(q.en); }, 250); }
    var o = document.getElementById('o-chep');
    var kiem = function(){ if(!o.value.trim()){ bao('Bạn gõ câu nghe được trước nhé'); return; }
      var k = soKhop(q.en, o.value); p.da = { chep:o.value.trim(), k:k, pt:k.phanTram }; p.ket.push({ en:q.en, chep:o.value.trim(), pt:k.phanTram }); veLai(); };
    document.getElementById('kiem').onclick = kiem; o.onkeydown = function(e){ if(e.key==='Enter') kiem(); };
  } else document.getElementById('tiep').onclick = function(){ p.i++; p.da=null; p.daDoc=false; veLai(); };
}

/* ---------- chạy ---------- */
function veLai(){
  if(st.man==='ipa') return veIPA();
  if(st.man==='am') return veAm();
  if(st.man==='buoi' && st.buoi){
    var moi = dsBuoi.filter(function(b){ return b.gd===st.buoi.gd && b.buoi===st.buoi.buoi; })[0];
    if(moi && moi !== st.buoi){ st.buoi = moi; batDauPhan(); }
    return veBuoi();
  }
  veTrangChu();
}
function taiLaiGiuCho(){
  var g = { man: st.man, gd: st.buoi && st.buoi.gd, buoi: st.buoi && st.buoi.buoi, phan: st.phan === 'kt' ? 'tu' : st.phan, am: st.am, y: window.scrollY };
  ghi('quayLai', g);
  location.reload();
}
(function(){
  var g = doc('quayLai', null); if(!g) return;
  ghi('quayLai', null);
  if(g.man === 'buoi'){
    var b = dsBuoi.filter(function(x){ return x.gd === g.gd && x.buoi === g.buoi; })[0];
    if(b){ st.buoi = b; st.gd = b.gd; st.man = 'buoi'; st.phan = g.phan; batDauPhan(); }
  } else if(g.man === 'am' && DS_IPA[g.am]){ st.man = 'am'; st.am = g.am; p = { quiz:null }; }
  else if(g.man === 'ipa'){ st.man = 'ipa'; }
  setTimeout(function(){ window.scrollTo(0, g.y || 0); }, 60);
})();
taiBoSung();
veLai();
})();
</script>
